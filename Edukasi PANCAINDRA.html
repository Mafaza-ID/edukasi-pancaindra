<style>
:root{--bg:#070b16;--panel:rgba(11,18,34,.82);--panel2:rgba(18,28,50,.78);--line:rgba(181,207,255,.16);--text:#f3f6ff;--muted:#9eacc9;--gold:#ffd166;--cyan:#71d9ff;box-sizing:border-box}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(ellipse at 52% 43%,#1c3150 0%,#101a30 34%,#080e1d 72%,#050914 100%);color:var(--text);font:13px/1.55 Manrope,system-ui,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 100%,rgba(45,119,174,.13),transparent 45%),linear-gradient(115deg,transparent 35%,rgba(255,255,255,.018) 50%,transparent 65%)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}

.brand{font-weight:800;font-size:16px;letter-spacing:.12em;white-space:nowrap;text-shadow:0 2px 18px #000}.brand:before{content:"✦";color:var(--gold);margin-right:8px}.brand small{display:block;font-weight:600;letter-spacing:.16em;color:var(--muted);font-size:9px;margin:1px 0 0 23px}

nav button,.tools button,.row button{font:600 11px Manrope,system-ui,sans-serif;color:#dce7ff;background:transparent;border:1px solid transparent;border-radius:11px;padding:9px 13px;cursor:pointer;white-space:nowrap;transition:all .22s ease}

.box h2{margin:7px 0 9px;font-size:18px;line-height:1.3;letter-spacing:-.035em}.box h3{margin:0 0 7px;font-size:13px;color:var(--gold);letter-spacing:.02em}.box p{margin:0;color:#c8d5ec;font-size:12px;line-height:1.7}

.sim{margin-top:13px;padding:13px;border:1px solid rgba(113,217,255,.17);border-radius:15px;background:linear-gradient(135deg,rgba(53,117,160,.13),rgba(255,255,255,.025))}.sim:before{content:"INTERACTIVE MODULE";display:block;color:#79d9f6;font-size:8px;font-weight:800;letter-spacing:.18em;margin-bottom:8px}
.row{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.row button{background:rgba(39,58,89,.72);border-color:rgba(164,194,241,.14);padding:8px 11px}.row .go{background:linear-gradient(135deg,#ffca69,#ed854b);border:0;font-weight:800;color:#261809;box-shadow:0 5px 18px rgba(237,133,75,.2)}
.care{margin-top:12px;padding:12px 13px;border-radius:14px;background:rgba(49,190,143,.09);border:1px solid rgba(75,222,174,.2);color:#b9f4dc;font-size:11px;line-height:1.65}.care b{display:block;color:#7de0b9;margin-bottom:3px}

.hint{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);color:#b4c4e2;font-size:10px;z-index:4;white-space:nowrap;padding:8px 15px;border:1px solid rgba(172,204,255,.14);border-radius:99px;background:rgba(8,16,32,.62);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.2)}

@media(max-width:1050px){aside{width:260px}nav{max-width:48vw}}
@media(max-width:820px){header{min-height:58px;padding:7px 9px;gap:6px;flex-wrap:wrap}.brand{font-size:13px}.brand small{display:none}nav{order:3;width:100%;max-width:none;justify-content:flex-start}nav button{padding:7px 10px} .tools{margin-left:auto}.tools button{padding:7px 9px}#L{display:none}#R{left:9px;right:9px;top:auto;bottom:50px;width:auto;max-height:30vh;display:flex;flex-direction:row;align-items:stretch;overflow-x:auto;overflow-y:hidden}#R .box{min-width:min(78vw,330px);padding:12px}#R .box:nth-child(2){min-width:min(72vw,300px)}.hint{bottom:8px;font-size:9px;padding:6px 10px}}

.lb:not(.on):not(:hover) span{display:none}.lb:not(.on){padding:2px}.lb.on{z-index:6}

.qo{display:grid;gap:9px;margin-top:14px}

.qpri,.qsec{width:100%;margin-top:12px;padding:12px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
.qpri{background:linear-gradient(135deg,#f5a524,#e0453f);border:0;color:#fff}.qpri:hover{filter:brightness(1.1)}
.qsec{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#e8f0ff}.qsec:hover{background:rgba(255,255,255,.12)}
.qres{text-align:center}.qpct{fill:#fff;font-size:22px;font-weight:800}.qpr2{font-size:18px;font-weight:800;margin-top:4px}
.qstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.qstats div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;text-align:center}.qstats b{display:block;font-size:18px}.qstats span{color:#9aa6c4;font-size:11px}
.qbr{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:12px}.qbr em{font-style:normal;color:#9aa6c4;text-align:right}
.qbar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.qbar i{display:block;height:100%;border-radius:9px}
.qlink{background:none;border:0;color:#7dd3fc;font-weight:700;font-size:12px;cursor:pointer;margin-top:10px;padding:0}
.qrev{display:none;list-style:none;margin:8px 0 0;padding:0;gap:8px}.qrev.open{display:grid}.qrev li{padding:10px 12px;border-radius:11px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);font-size:12px}.qrev b{display:block;margin-bottom:2px}.qrev span{color:#a7f3d0}
